# Netlify configuration for the AceTest Next.js client.
# The Express API is hosted separately (see README "Build & Deployment").
# After adding this file, redeploy in Netlify: Deploys -> "Clear cache and deploy site".

[build]
  base = "client"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_API_URL = "https://acetest-api.onrender.com/api"

# The client is a fully static export (output: 'export'); Netlify serves the
# out/ directory directly. NEXT_PUBLIC_API_URL is baked into the bundle at
# build time (client/services/api.js) and is set above; it must point to the
# deployed Express API. Do not put secrets in this file.