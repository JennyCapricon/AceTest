# Netlify configuration for the AceTest Next.js client.
# The Express API is hosted separately (see README "Build & Deployment").
# After adding this file, redeploy in Netlify: Deploys -> "Clear cache and deploy site".

[build]
  base = "client"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Netlify auto-detects Next.js and applies the official Next.js runtime plugin.
# NEXT_PUBLIC_API_URL must be set as a build-time environment variable in the
# Netlify dashboard (Site configuration -> Environment variables) and must point
# to the deployed Express API, e.g. https://acetest-api.onrender.com/api